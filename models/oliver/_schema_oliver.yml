version: 2

models:
  - name: oliver_dim_customer
    description: "Oliver Customer Dimension"
  - name: oliver_dim_employee
    description: "Insurance Employee Dimension"
    columns:
      - name: employee_key
        tests:
          - unique
  - name: oliver_dim_date
    description: "Oliver Date Dimension"
  - name: oliver_dim_product
    description: "Oliver Product Dimension"
    columns:
      - name: product_name
        tests:
          - accepted_values:
              values:
                - "Small Coffee"
                - "Marshmallows"
                - "Small Popcorn"
                - "Gummy Bears"
                - "Chocolate Bar"
  - name: oliver_dim_store
    description: "Oliver Store Dimension"
  - name: fact_sales
    description: "Oliver Sales Fact"
    columns:
      - name: employee_key
        description: "A foreign key to the employee dimension"
        tests:
          - not_null
  - name: stg_employee_certifications
    description: |
      Staging model for employee certifications.
      Each record represents a completed certification by a single employee.
  - name: fact_certification
    description: |
      Employee certification fact.
      The grain of this table is employee + date + certification.
      Each record represents a completed certification by a single employee.
    columns:
      - name: date_key
        tests:
          - relationships:
              to: ref('oliver_dim_date')
              field: date_key
      - name: employee_key    
        tests:
          - relationships:
              to: ref('oliver_dim_employee')
              field: employee_key